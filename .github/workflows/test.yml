# Automatische Prüfung bei jedem Pull Request nach main (GitHub Actions, gratis).
# Baut das CMS und führt die Tests aus. Nur wenn alles grün ist, wird nach main zusammengeführt.
name: Build und Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm run build
      - run: npm test
